name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build Compendiums
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code (zero warnings)
        run: npm run lint:warnings

      - name: Run unit & schema validation tests
        run: npm test

      - name: Build CSS and compendium packs
        run: npm run build:ci

